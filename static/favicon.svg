<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Michael Pham">
  <!-- A confidence interval and its point estimate. Every edge sits on a
       4-unit grid, so at 16px each stroke is exactly one pixel wide, and at
       32 and 48px they stay whole pixels too. The mark is centred half a
       pixel above the tile's centre, which reads as centred. -->
  <rect width="64" height="64" rx="14" fill="#2C4A73"/>
  <g fill="#FBFAF7">
    <rect x="12" y="28" width="40" height="4"/>
    <rect x="12" y="20" width="4" height="20" rx="2"/>
    <rect x="48" y="20" width="4" height="20" rx="2"/>
  </g>
  <circle cx="32" cy="30" r="7" fill="#C68B3C"/>
</svg>
